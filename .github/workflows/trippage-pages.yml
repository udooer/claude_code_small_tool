name: Deploy TripPage to GitHub Pages
# 只部署 TripPage/site/ 內「已加密」的頁面 (用 build.py --password 產生)
on:
  push:
    branches: [main]
    paths: ["TripPage/site/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse unencrypted pages
        run: |
          for f in TripPage/site/*/index.html; do
            [ -e "$f" ] || continue
            grep -q 'name="f"\|id="f"' "$f" && grep -q 'AES\|PBKDF2' "$f" || { echo "未加密: $f"; exit 1; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: TripPage/site }
      - id: deployment
        uses: actions/deploy-pages@v4
